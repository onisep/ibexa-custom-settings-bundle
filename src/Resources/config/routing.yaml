ibexa_custom_settings_index:
    path: /ibexa-custom-settings
    defaults: { _controller: Onisep\IbexaCustomSettingsBundle\Controller\IbexaCustomSettingController::index }

ibexa_custom_settings_save:
    path: /ibexa-custom-settings/{locationId}/save
    defaults: { _controller: Onisep\IbexaCustomSettingsBundle\Controller\IbexaCustomSettingController::save }
    methods: [POST]
    requirements:
        locationId: '\d+'